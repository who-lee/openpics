name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run is cancelled rather than left burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Bundling is where a passing typecheck can still hide a runtime failure:
      # a lazy require survives as a string and is unresolvable in the packaged
      # app. This step proves the bundle resolves.
      - name: Package (unpacked)
        run: npm run package:dir

      - name: Verify the bundle loads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = 'out/main/index.js'
          if (-not (Test-Path $main)) { throw "no bundle at $main" }
          # A bare require of a relative path would resolve to a file that does
          # not exist next to the bundle, and only at runtime.
          $bare = Select-String -Path $main -Pattern 'require\("\./' -Quiet
          if ($bare) { throw 'bundle contains a bare relative require' }
          Write-Output 'bundle has no bare relative requires'

  mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build MCP server
        run: npm run build:mcp

      - name: Verify the MCP server answers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = 'dist-mcp/mcp/server.js'
          if (-not (Test-Path $server)) { throw "no server at $server" }

          # Speak the protocol rather than just checking the process survives:
          # an empty stdin closes immediately and exits 0, so liveness alone
          # proves nothing. A real initialize handshake proves the server
          # loaded, wired its tools, and can answer.
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":' +
                 '{"protocolVersion":"2024-11-05","capabilities":{},' +
                 '"clientInfo":{"name":"ci","version":"1"}}}'
          $resp = $req | node $server 2>&1 | Out-String

          if ($resp -notmatch '"serverInfo"') {
            throw "MCP server did not complete initialize. Got: $resp"
          }
          if ($LASTEXITCODE -ne 0) { throw "node exited $LASTEXITCODE" }

          $req2 = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          $tools = $req2 | node $server 2>&1 | Out-String
          if ($tools -notmatch '"tools"') {
            throw "MCP server did not list tools. Got: $tools"
          }

          Write-Output 'MCP server completed initialize and listed tools'
